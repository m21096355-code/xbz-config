<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XBZ_MUSEOD</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fa;--white:#fff;--border:#e8ecf0;--text:#1a1a2e;--text2:#64748b;--text3:#94a3b8;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--orange:#ea580c;--purple:#7c3aed;--r:10px;--r2:14px;--r3:20px;--shadow2:0 4px 16px rgba(0,0,0,0.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{text-decoration:none;color:var(--blue)}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}

/* Login */
.login-bg{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r3);padding:48px 40px;width:400px;max-width:92vw;text-align:center;box-shadow:var(--shadow2)}
.login-icon{width:72px;height:72px;margin:0 auto 20px;background:rgba(37,99,235,0.08);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:2em}
.login-card h1{font-size:1.4em;font-weight:700;margin-bottom:6px}
.login-card .sub{color:var(--text2);font-size:0.88em;margin-bottom:28px}
.field{margin-bottom:14px;text-align:right}
.field label{display:block;color:var(--text2);font-size:0.8em;font-weight:600;margin-bottom:5px}
.field input,.field select{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--white);font-size:0.88em;transition:0.2s}
.field input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.btn{width:100%;padding:13px;border:none;border-radius:var(--r);font-size:0.92em;font-weight:700;transition:0.15s}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:#1d4ed8}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#15803d}
.err{color:var(--red);font-size:0.85em;background:rgba(220,38,38,0.08);padding:12px;border-radius:var(--r);margin-bottom:14px}

/* Topbar */
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 24px;display:flex;justify-content:space-between;align-items:center;height:56px;position:sticky;top:0;z-index:50}
.topbar .brand{display:flex;align-items:center;gap:10px}
.topbar .brand h2{font-size:1.1em;font-weight:700}
.topbar .brand span{color:var(--blue)}
.topbar .links{display:flex;gap:4px}
.topbar .links a,.topbar .links button{color:var(--text2);padding:8px 12px;border-radius:var(--r);font-size:0.83em;font-weight:600;background:none;border:none}
.topbar .links a:hover,.topbar .links button:hover{background:var(--bg);color:var(--text)}

/* Dashboard */
.ct{max-width:900px;margin:24px auto;padding:0 20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.stat{background:var(--white);border:1px solid var(--border);border-radius:var(--r2);padding:18px;display:flex;align-items:center;gap:14px}
.stat .ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2em}
.stat .ico.p{background:rgba(124,58,237,0.08);color:var(--purple)}
.stat .ico.b{background:rgba(37,99,235,0.08);color:var(--blue)}
.stat .ico.g{background:rgba(22,163,74,0.08);color:var(--green)}
.stat .n{font-size:1.3em;font-weight:800}
.stat .lb{color:var(--text3);font-size:0.78em;font-weight:600}
.sec{background:var(--white);border:1px solid var(--border);border-radius:var(--r3);padding:20px;margin-bottom:20px}
.sec-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.btn-sm{padding:9px 18px;border:none;border-radius:var(--r);font-size:0.83em;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--blue);color:#fff}
.btn-refresh{background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.search{flex:1;min-width:180px}
.search input{width:100%;padding:9px 14px;border:1.5px solid var(--border);border-radius:var(--r);font-size:0.85em}

/* Table */
table{width:100%;border-collapse:collapse}
thead th{padding:10px 12px;text-align:right;font-size:0.73em;font-weight:700;color:var(--text3);border-bottom:2px solid var(--border);text-transform:uppercase;letter-spacing:0.3px}
tbody td{padding:12px;font-size:0.86em;border-bottom:1px solid var(--border)}
tbody tr:hover{background:rgba(37,99,235,0.02)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:0.73em;font-weight:600}
.bg{background:rgba(22,163,74,0.08);color:var(--green)}
.br{background:rgba(220,38,38,0.08);color:var(--red)}
.bp{background:rgba(37,99,235,0.08);color:var(--blue)}
.user-name{font-weight:700}
.uuid{font-family:monospace;font-size:0.72em;color:var(--text3);direction:ltr}
.trf{font-size:0.82em;color:var(--text2);direction:ltr}
.prog{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:5px;width:100px}
.prog-fill{height:100%;border-radius:3px}
.pf-g{background:var(--green)}.pf-b{background:var(--blue)}.pf-r{background:var(--red)}
.btn-s{padding:5px 10px;border:none;border-radius:8px;font-size:0.78em;font-weight:600}
.bs{background:rgba(37,99,235,0.08);color:var(--blue)}
.bw{background:rgba(234,88,12,0.08);color:var(--orange)}
.bd{background:rgba(220,38,38,0.08);color:var(--red)}
.bgrp{display:flex;gap:4px}

/* Modal */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.mo.show{display:flex}
.md{background:var(--white);border-radius:var(--r3);padding:28px;width:520px;max-width:94vw;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow2)}
.md-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.md-h h3{font-size:1.05em;font-weight:700}
.md-x{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--white);font-size:1em}
.fr{display:flex;gap:8px;flex-wrap:wrap}.fr>.field{flex:1;min-width:120px}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--r);font-size:0.88em;display:none;z-index:200}

@media(max-width:600px){.stats{grid-template-columns:1fr}table{font-size:0.8em}td,th{padding:8px 6px!important}}
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="login-bg">
<div class="login-card">
<div class="login-icon">⚡</div>
<h1>وارد حساب خود شوید</h1>
<div class="sub">خوش آمدید، لطفا اطلاعات خود را وارد کنید</div>
<div id="loginErr" class="err" style="display:none"></div>
<input id="loginUser" placeholder="نام کاربری" style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r);font-size:0.88em;margin-bottom:12px" autocomplete="username">
<input id="loginPass" type="password" placeholder="گذرواژه" style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r);font-size:0.88em;margin-bottom:18px" autocomplete="current-password">
<button class="btn btn-blue" onclick="doLogin()">🚪 ورود</button>
<div style="margin-top:20px;color:var(--text3);font-size:0.72em">XBZ_MUSEOD v2.0.0 — ساخته شده با ❤️</div>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashPage" style="display:none">
<div class="topbar">
<div class="brand"><h2>⚡ <span>XBZ_MUSEOD</span></h2></div>
<div class="links">
<button onclick="location.reload()">🔄</button>
<button onclick="window.open('/sub/'+prompt('UUID:'),'_blank')">📋 ساب</button>
</div>
</div>
<div class="ct">
<div class="stats">
<div class="stat"><div class="ico p">👥</div><div><div class="n" id="sActive">0</div><div class="lb">کاربران فعال</div></div></div>
<div class="stat"><div class="ico b">📊</div><div><div class="n" id="sTraffic">0 GB</div><div class="lb">مصرف کل</div></div></div>
<div class="stat"><div class="ico g">📡</div><div><div class="n" id="sUsers">0</div><div class="lb">کل کاربران</div></div></div>
</div>

<div class="sec">
<div class="sec-top">
<button class="btn-sm btn-primary" onclick="showM('addM')">➕ افزودن کاربر</button>
<button class="btn-sm btn-primary" onclick="showM('batchM')" style="background:var(--green)">👥 ساخت گروهی</button>
<div class="search"><input id="searchInput" placeholder="🔍 جستجو..." oninput="filterUsers()"></div>
</div>
<table>
<thead><tr><th>کاربر</th><th>پروتکل</th><th>وضعیت</th><th>مصرف</th><th>عملیات</th></tr></thead>
<tbody id="userTable"></tbody>
</table>
</div>
</div></div>

<!-- ADD USER MODAL -->
<div class="mo" id="addM">
<div class="md">
<div class="md-h"><h3>👤 افزودن کاربر</h3><button class="md-x" onclick="hideM('addM')">✕</button></div>
<div class="field"><label>نام کاربری</label><input id="a-email" placeholder="مثلاً user-01"></div>
<div class="fr"><div class="field"><label>پروتکل</label><select id="a-proto"><option value="vless">VLESS</option><option value="vmess">VMess</option><option value="trojan">Trojan</option></select></div>
<div class="field"><label>شبکه</label><select id="a-net"><option value="ws">WebSocket</option><option value="grpc">gRPC</option><option value="tcp">TCP</option></select></div></div>
<div class="fr"><div class="field"><label>دامنه سرور</label><input id="a-domain" placeholder="domain.com"></div>
<div class="field"><label>پورت</label><input id="a-port" type="number" value="443"></div></div>
<div class="fr"><div class="field"><label>SNI</label><input id="a-sni" placeholder="SNI (اختیاری)"></div>
<div class="field"><label>امنیت</label><select id="a-sec"><option value="none">None</option><option value="tls">TLS</option></select></div></div>
<div class="fr"><div class="field"><label>حد مصرف (GB)</label><input id="a-total" type="number" value="5"></div>
<div class="field"><label>تاریخ پایان (روز)</label><input id="a-expiry" type="number" value="30"></div></div>
<button class="btn btn-blue" onclick="addUser()" style="margin-top:10px">افزودن کاربر</button>
</div></div>

<!-- BATCH MODAL -->
<div class="mo" id="batchM">
<div class="md">
<div class="md-h"><h3>👥 ساخت گروهی</h3><button class="md-x" onclick="hideM('batchM')">✕</button></div>
<div class="field"><label>پیشوند نام</label><input id="b-prefix" value="user" placeholder="user"></div>
<div class="fr"><div class="field"><label>تعداد</label><input id="b-count" type="number" value="5" min="1" max="50"></div>
<div class="field"><label>پروتکل</label><select id="b-proto"><option value="vless">VLESS</option><option value="vmess">VMess</option><option value="trojan">Trojan</option></select></div></div>
<div class="fr"><div class="field"><label>دامنه سرور</label><input id="b-domain" placeholder="domain.com"></div>
<div class="field"><label>پورت</label><input id="b-port" type="number" value="443"></div></div>
<div class="fr"><div class="field"><label>SNI</label><input id="b-sni" placeholder="SNI"></div>
<div class="field"><label>امنیت</label><select id="b-sec"><option value="none">None</option><option value="tls">TLS</option></select></div></div>
<div class="fr"><div class="field"><label>حد مصرف (GB)</label><input id="b-total" type="number" value="5"></div>
<div class="field"><label>تاریخ پایان (روز)</label><input id="b-expiry" type="number" value="30"></div></div>
<button class="btn btn-green" onclick="batchAdd()" style="margin-top:10px">ساخت گروهی</button>
</div></div>

<!-- USER INFO MODAL -->
<div class="mo" id="infoM">
<div class="md">
<div class="md-h"><h3>📋 لینک کاربر</h3><button class="md-x" onclick="hideM('infoM')">✕</button></div>
<div id="infoContent"></div>
</div></div>

<div class="toast" id="toast">✅ انجام شد!</div>

<script>
let loggedIn=false;

function api(url,body){return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined}).then(r=>r.json())}
function apiGet(url){return fetch(url).then(r=>r.json())}

function doLogin(){
    api("/api/login",{username:document.getElementById("loginUser").value,password:document.getElementById("loginPass").value}).then(d=>{
        if(d.ok){loggedIn=true;document.getElementById("loginPage").style.display="none";document.getElementById("dashPage").style.display="block";loadUsers()}
        else{var e=document.getElementById("loginErr");e.textContent=d.error;e.style.display="block"}
    }).catch(()=>{var e=document.getElementById("loginErr");e.textContent="خطا در اتصال";e.style.display="block"})
}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!loggedIn)doLogin()})

function showM(id){document.getElementById(id).classList.add("show")}
function hideM(id){document.getElementById(id).classList.remove("show")}

function toast(m){var t=document.getElementById("toast");t.textContent=m||"✅ انجام شد!";t.style.display="block";setTimeout(()=>t.style.display="none",2000)}

function loadUsers(){
    apiGet("/api/users").then(users=>{
        let active=0,totalTraffic=0;
        users.forEach(u=>{if(u.enable)active++;totalTraffic+=u.total_used});
        document.getElementById("sActive").textContent=active;
        document.getElementById("sTraffic").textContent=(totalTraffic/1073741824).toFixed(1)+" GB";
        document.getElementById("sUsers").textContent=users.length;
        let tb=document.getElementById("userTable");tb.innerHTML="";
        users.forEach(u=>{
            let pct=u.usage_pct;let cls=pct>80?"pf-r":pct>50?"pf-b":"pf-g";
            tb.innerHTML+=`<tr class="urow" data-name="${u.email}">
            <td><div class="user-name">${u.email}</div><div class="uuid">${u.uuid.substring(0,16)}...</div></td>
            <td><span class="badge bp">${u.protocol.toUpperCase()}</span></td>
            <td>${u.enable?'<span class="badge bg">🟢 فعال</span>':'<span class="badge br">🔴 غیرفعال</span>'}</td>
            <td><span class="trf">${u.used_str} / ${u.total_str}</span>
            ${u.total?`<div class="prog"><div class="prog-fill ${cls}" style="width:${pct}%"></div></div>`:''}</td>
            <td><div class="bgrp">
            <button class="btn-s bs" onclick='showLink(${JSON.stringify(u).replace(/'/g,"&#39;")})' title="لینک">🔗</button>
            <button class="btn-s bw" onclick="toggleU(${u.id})">🔄</button>
            <button class="btn-s bd" onclick="delU(${u.id})">🗑️</button>
            </div></td></tr>`;
        });
    });
}

function addUser(){
    api("/api/users/add",{email:document.getElementById("a-email").value,protocol:document.getElementById("a-proto").value,
        domain:document.getElementById("a-domain").value,port:document.getElementById("a-port").value,
        sni:document.getElementById("a-sni").value,network:document.getElementById("a-net").value,
        security:document.getElementById("a-sec").value,path:"/ws",
        total:document.getElementById("a-total").value,expiry:document.getElementById("a-expiry").value
    }).then(d=>{if(d.ok){hideM("addM");toast("✅ کاربر اضافه شد!");loadUsers()}});
}

function batchAdd(){
    api("/api/users/batch",{prefix:document.getElementById("b-prefix").value,
        count:document.getElementById("b-count").value,protocol:document.getElementById("b-proto").value,
        domain:document.getElementById("b-domain").value,port:document.getElementById("b-port").value,
        sni:document.getElementById("b-sni").value,network:"ws",security:document.getElementById("b-sec").value,
        path:"/ws",total:document.getElementById("b-total").value,expiry:document.getElementById("b-expiry").value
    }).then(d=>{if(d.ok){hideM("batchM");toast(`✅ ${d.count} کاربر ساخته شد!`);loadUsers()}});
}

function delU(id){if(confirm("حذف شود؟"))api("/api/users/delete/"+id).then(()=>{toast("🗑️ حذف شد!");loadUsers()})}
function toggleU(id){api("/api/users/toggle/"+id).then(()=>{toast("🔄 وضعیت تغییر کرد!");loadUsers()})}

function showLink(u){
    let subUrl=location.origin+"/sub/"+u.uuid;
    let info=`<div style="margin-bottom:14px"><strong>نام:</strong> ${u.email}</div>
    <div style="margin-bottom:14px"><strong>UUID:</strong> <code style="direction:ltr">${u.uuid}</code></div>
    <div style="margin-bottom:14px"><strong>پروتکل:</strong> ${u.protocol.toUpperCase()}</div>
    <div style="margin-bottom:14px"><strong>وضعیت:</strong> ${u.enable?'🟢 فعال':'🔴 غیرفعال'}</div>
    <div style="margin-bottom:14px"><strong>مصرف:</strong> ${u.used_str} / ${u.total_str}</div>
    <hr style="margin:16px 0;border:none;border-top:1px solid var(--border)">
    <div style="margin-bottom:10px"><strong>📋 لینک اشتراک:</strong></div>
    <div style="background:var(--bg);padding:12px;border-radius:var(--r);word-break:break-all;font-size:0.8em;direction:ltr;margin-bottom:14px">${subUrl}</div>
    <button class="btn btn-blue" onclick="navigator.clipboard.writeText('${subUrl}').then(()=>toast('📋 کپی شد!'))" style="margin-bottom:12px">📋 کپی لینک اشتراک</button>
    <div style="margin-bottom:10px"><strong>🔗 لینک VPN:</strong></div>
    <div style="background:var(--bg);padding:12px;border-radius:var(--r);word-break:break-all;font-size:0.75em;direction:ltr;margin-bottom:14px">${u.link}</div>
    <button class="btn btn-blue" onclick="navigator.clipboard.writeText('${u.link.replace(/'/g,"\\'")}').then(()=>toast('📋 کپی شد!'))">📋 کپی لینک VPN</button>
    <div style="margin-top:16px;padding:12px;background:rgba(37,99,235,0.06);border-radius:var(--r);font-size:0.8em">
    <strong>💡 آموزش استفاده:</strong><br>
    ۱. لینک اشتراک رو کپی کن<br>
    ۲. توی v2rayNG → اشتراک → Paste کن<br>
    ۳. یا توی Hiddify → لینک اشتراک → اضافه کن
    </div>`;
    document.getElementById("infoContent").innerHTML=info;
    showM("infoM");
}

function filterUsers(){
    let q=document.getElementById("searchInput").value.toLowerCase();
    document.querySelectorAll(".urow").forEach(r=>{r.style.display=r.dataset.name.toLowerCase().includes(q)?"":"none"});
}
</script>
</body>
</html>
